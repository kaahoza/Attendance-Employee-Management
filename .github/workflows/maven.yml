# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the source code from gihub
      - name: Checkout Code
        uses: actions/checkout@v4

      # Stage 2: Setup Java Environment
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Stage 3: Build the application with Maven
      - name: Build with Maven
        run: mvn clean package

      # Stage 4: Login to Docker Hub
      - name: Login to Docker Hub
        if:
          github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      # Step 5: Build and Push Docker Image
      - name: Build and Push Docker Image
        if:
          github.event_name == 'push'
        uses: docker/build-action@v6
        with:
          context: .
          push: false
          tags:
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-management:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/employee-management:${{github.sha}}


